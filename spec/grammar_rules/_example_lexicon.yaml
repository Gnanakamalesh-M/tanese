# Demo words for grammar examples, v0.1 -- NOT vocabulary.
#
# Phase 1B needs words to show grammar with, but LOCKED decisions 14-15 reserve official
# vocabulary for the Phase 2 pipeline (phonotactic check -> morphology check -> collision
# check -> rank -> human approve) and a separate file. So these are citation forms invented
# to fill example slots, nothing more:
#
#   * every entry is `status: experimental`, and the schema allows no other value here, so
#     `official` is literally unrepresentable in this file;
#   * nothing here may be copied into data/vocabulary/ -- check 12 in
#     tanese_nlp.grammar.contradictions fails if any of these forms turns up there. Phase 2
#     must re-derive a word through the pipeline if it wants it, which may well reject it;
#   * no collision detection has been run on them (that tool is Phase 2), so two of these
#     may well be confusably similar. They were checked for phonotactic legality and exact
#     duplication only.
#
# Grammar examples may use ONLY these roots (check 9: lexicon closure). That is the point of
# the file: it stops the same form meaning "house" in one rule and "to eat" in another.
#
# `class` is the word class the grammar rules expect: noun, verb, pronoun, numeral, adverb,
# interrogative, copula. Verbs and the copula are listed in their citation form (bare root,
# non-finite -- see GR-VERB-002).

version: v0.1

words:
