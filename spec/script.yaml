# Tanese script, v0.1 -- machine-readable source of truth.
#
# Locked decisions 12 and 13: the script is a mapping layer on top of the romanization, with
# one id per mora, and no custom font or Unicode proposal is in scope. The canonical text
# form of a script word is the dot-joined id sequence (`kaatha` -> TS-KA.TS-LONG.TS-THA),
# which stays readable in YAML and diffable in git; each mora also carries a Private Use
# Area codepoint for Phase 6 rendering.
#
# The script is a FEATURAL abugida. Only the 21 atoms below are hand-designed -- 6 place
# frames, 7 manner marks, 5 vowel marks and 3 standalone marks. The 17 bases are frame +
# manner combinations, and every mora is a base + vowel mark, so the whole glyph table is
# derived rather than drawn 86 times. (The Phase 1A plan said 25 atoms, counting the bases
# themselves; making the bases featural compositions brought it down to 21.) The prose shape
# descriptions therefore live on the atoms, where there is something real to describe, and
# each mora entry carries its recipe instead of a restated sentence.
#
# The `moras` block is generated from spec/phonology.yaml -- it must contain exactly the
# legal mora set, which tests/unit/test_spec_consistency.py asserts.

version: v0.1

design:
  type: featural abugida
  reason: >-
    A pure syllabary would need one independently drawn glyph per mora, which is neither
    honestly finishable nor justifiable -- there would be nothing principled to say about any
    individual shape. Making the script featural instead (place encoded by the frame, manner
    by an inner mark, in the spirit of Hangul but with no shared shapes) means the whole
    table follows from 25 decisions, each of which has a reason, and it gives Phase 6 a
    composition recipe it can render as SVG without a font.
  alternatives: >-
    (a) A hand-drawn syllabary, rejected above. (b) An abugida with arbitrary but maximally
    distinctive base shapes, which would keep the consonants easier to tell apart but leave
    every shape unjustified and lose the featural logic.
  problems: >-
    Featurally derived glyphs risk looking alike: the three retroflexes differ from their
    alveolar counterparts only by the curled foot, and the two glides only by a doubled
    stroke. Nothing has been rendered yet, so the shape descriptions are unverified prose --
    see README "Not verified".

inherent_vowel: none
virama: none
inherent_vowel_reason: >-
  A deliberate departure from Indic abugidas, which give the bare consonant an inherent /a/
  and need a virama to cancel it. Here every syllabic glyph carries an explicit vowel mark.
  That costs one extra mark on the /a/ moras and removes a whole class of converter bugs,
  since no glyph is ever ambiguous between "consonant + a" and "bare consonant".

writing:
  direction: left-to-right
  marks_follow: >-
    TS-LONG, TS-NASAL and TS-GEM are full moras and are written in sequence, not stacked on a
    neighbour. TS-GEM precedes the mora whose onset it doubles; the other two follow the mora
    they modify.

# ---------------------------------------------------------------------------
# The 25 hand-designed atoms.
# ---------------------------------------------------------------------------

atoms:
  frames:
    - id: FRAME-CARRIER
      place: none
      shape: A plain vertical stem, unadorned.
    - id: FRAME-LABIAL
      place: labial
      shape: A vertical stem closed by a bowl on its left side.
    - id: FRAME-ALVEOLAR
      place: alveolar
      shape: A vertical stem with a flat crossbar at mid height.
    - id: FRAME-RETROFLEX
      place: retroflex
      shape: A vertical stem whose foot curls rightward into a hook.
    - id: FRAME-VELAR
      place: velar
      shape: A vertical stem opening into a two-pronged fork at the top.
    - id: FRAME-PALATAL
      place: palatal
      shape: A stem leaning to the right, drawn as a single diagonal.
  manner_marks:
    - id: MANNER-PLAIN
      manner: voiceless plosive
      shape: No inner mark. The bare frame is the voiceless plosive of its place.
    - id: MANNER-DOT
      manner: voiced plosive
      shape: A single dot inside the frame.
    - id: MANNER-BAR
      manner: nasal
      shape: A horizontal bar drawn through the stem.
    - id: MANNER-SLASHES
      manner: fricative
      shape: Two short parallel slashes across the stem.
    - id: MANNER-WAVE
      manner: tap
      shape: One short wave on the stem.
    - id: MANNER-TAIL
      manner: lateral
      shape: A straight tail extending from the foot of the stem.
    - id: MANNER-DOUBLE
      manner: glide
      shape: The frame drawn twice as two parallel strokes.
  vowel_marks:
    - id: VOW-A
      vowel: a
      shape: A short stroke to the right of the foot.
    - id: VOW-I
      vowel: i
      shape: A tick at the top right.
    - id: VOW-U
      vowel: u
      shape: A hook beneath the foot.
    - id: VOW-E
      vowel: e
      shape: A bar across the top.
    - id: VOW-O
      vowel: o
      shape: A bar on the right side at mid height.
  standalone_marks:
    - id: MARK-LONG
      shape: A long horizontal stroke on the baseline.
      reason: Visually "holds" the preceding vowel, matching what it does phonologically.
    - id: MARK-NASAL
      shape: A small closed hook on the baseline.
      reason: >-
        Closed, unlike the retroflex frame's open hook, so the only standalone hook in the
        script cannot be read as a consonant frame.
    - id: MARK-GEM
      shape: A single dot on the baseline.
      reason: >-
        The smallest mark in the script, for the mora with the least content -- a held
        closure and no segment of its own.

# One base per onset, plus the carrier. Each is a frame and a manner mark; this is the whole
# featural claim, and the 16 combinations below are all distinct.
bases:
  - id: BASE-CARRIER
    onset: null
    composition: [FRAME-CARRIER, MANNER-PLAIN]
  - id: BASE-P
    onset: p
    composition: [FRAME-LABIAL, MANNER-PLAIN]
  - id: BASE-B
    onset: b
    composition: [FRAME-LABIAL, MANNER-DOT]
  - id: BASE-M
    onset: m
    composition: [FRAME-LABIAL, MANNER-BAR]
  - id: BASE-W
    onset: w
    composition: [FRAME-LABIAL, MANNER-DOUBLE]
  - id: BASE-T
    onset: t
    composition: [FRAME-ALVEOLAR, MANNER-PLAIN]
  - id: BASE-D
    onset: d
    composition: [FRAME-ALVEOLAR, MANNER-DOT]
  - id: BASE-N
    onset: "n"
    composition: [FRAME-ALVEOLAR, MANNER-BAR]
  - id: BASE-S
    onset: s
    composition: [FRAME-ALVEOLAR, MANNER-SLASHES]
  - id: BASE-R
    onset: r
    composition: [FRAME-ALVEOLAR, MANNER-WAVE]
  - id: BASE-L
    onset: l
    composition: [FRAME-ALVEOLAR, MANNER-TAIL]
  - id: BASE-TH
    onset: th
    composition: [FRAME-RETROFLEX, MANNER-PLAIN]
  - id: BASE-DH
    onset: dh
    composition: [FRAME-RETROFLEX, MANNER-DOT]
  - id: BASE-NH
    onset: nh
    composition: [FRAME-RETROFLEX, MANNER-BAR]
  - id: BASE-K
    onset: k
    composition: [FRAME-VELAR, MANNER-PLAIN]
  - id: BASE-G
    onset: g
    composition: [FRAME-VELAR, MANNER-DOT]
  - id: BASE-Y
    onset: "y"
    composition: [FRAME-PALATAL, MANNER-DOUBLE]

# ---------------------------------------------------------------------------
# The mora table: one id per legal mora. Generated from spec/phonology.yaml.
# `mora` is the romanized spelling for syllabic moras, null for the standalone marks
# (which have no segment to spell on their own).
# ---------------------------------------------------------------------------

moras:
